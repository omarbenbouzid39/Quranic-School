<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>معرض الصور - مدرسة خديجة بنت خويلد</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #121212;
      margin: 0;
      color: white;
      text-align: center;
    }

    nav {
      background-color: #003366;
      padding: 15px 0;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    nav ul li {
      display: inline-block;
      margin: 0 15px;
    }

    nav ul li a {
      color: #FFD700;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1em;
    }

    nav ul li a:hover {
      color: #9B72FF;
    }

    .gallery-container {
      position: relative;
      max-width: 700px;
      margin: 50px auto;
    }

    .gallery-image {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 0 20px #000;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 3em;
      color: #FFD700;
      background-color: rgba(0, 0, 0, 0.4);
      padding: 10px 20px;
      cursor: pointer;
      user-select: none;
      border-radius: 8px;
      transition: 0.3s;
    }

    .arrow.disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    .arrow.left {
      left: -60px;
    }

    .arrow.right {
      right: -60px;
    }
  </style>
</head>
<body>

<nav>
  <ul>
    <li><a href="index.html">الرئيسية</a></li>
    <li><a href="about.html">عن المدرسة</a></li>
    <li><a href="gallery.html">المعرض</a></li>
    <li><a href="register.html">التسجيل</a></li>
    <li><a href="contact.html">تواصل معنا</a></li>
  </ul>
</nav>

<h1>📷 معرض الصور</h1>

<div class="gallery-container">
  <span class="arrow left" id="prev">&#10094;</span>
  <img src="images/photo1.jpg" id="gallery-image" class="gallery-image" alt="صورة المعرض">
  <p id="image-caption" style="margin-top: 15px; font-size: 1.1em; color: #FFD700;"></p>
  <div style="margin-top: 20px;">
    <a id="download-btn" class="gallery-btn" href="#" style="margin: 0 10px; background-color: #003366; padding: 10px 20px; border-radius: 8px; text-decoration: none; color: #FFD700;">⬇ تحميل الصورة</a>
    <a id="share-btn" class="gallery-btn" style="margin: 0 10px; background-color: #003366; padding: 10px 20px; border: none; border-radius: 8px; color: #FFD700; cursor: pointer;">🔗 مشاركة الصورة</a>
  </div>
  
  <span class="arrow right" id="next">&#10095;</span>
</div>

<script>
    const images = [
      { src: "images/photo1.jpg", caption: "📖 حصة حفظ جماعية لطلبة المدرسة" },
      { src: "images/photo2.jpg", caption: "🏅 تكريم المتفوقين في مسابقة الترتيل" },
      { src: "images/photo3.jpg", caption: "👨‍🏫 الفريق الرياضي لكرة القدم" }
    ];
  
    let currentIndex = 0;
  
    const img = document.getElementById("gallery-image");
    const caption = document.getElementById("image-caption");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const downloadBtn = document.getElementById("download-btn");
    const shareBtn = document.getElementById("share-btn");
  
    function updateGallery() {
      const current = images[currentIndex];
      img.src = current.src;
      caption.textContent = current.caption;
  
      prev.classList.toggle("disabled", currentIndex === 0);
      next.classList.toggle("disabled", currentIndex === images.length - 1);
  
      // تحديث رابط التحميل
      downloadBtn.href = current.src;
      downloadBtn.download = `photo${currentIndex + 1}.jpg`;
    }
  
    prev.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex--;
        updateGallery();
      }
    });
  
    next.addEventListener("click", () => {
      if (currentIndex < images.length - 1) {
        currentIndex++;
        updateGallery();
      }
    });
  
    shareBtn.addEventListener("click", async () => {
      const current = images[currentIndex];
      if (navigator.share) {
        try {
          await navigator.share({
            title: "📸 صورة من مدرسة خديجة بنت خويلد",
            text: current.caption,
            url: current.src
          });
        } catch (err) {
          alert("حدث خطأ أثناء المشاركة.");
        }
      } else {
        alert("مشاركة الصور غير مدعومة في هذا المتصفح.");
      }
    });
  
    updateGallery();
  </script>
  

</body>
</html>
