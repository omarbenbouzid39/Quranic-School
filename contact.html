<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <title>تواصل معنا - خديجة بنت خويلد</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      background-color: #121212;
      color: #ffffff;
      line-height: 1.6;
    }

    /* Navbar */
    nav {
      background-color: #003366;
      padding: 15px 0;
      text-align: center;
    }
    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    nav ul li {
      display: inline-block;
      margin: 0 15px;
    }
    nav ul li a {
      color: #FFD700;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1em;
      transition: color 0.3s;
    }
    nav ul li a:hover {
      color: #9B72FF;
    }

    header {
      background-color: #003366;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      color: #FFD700;
      font-size: 2em;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .contact-info {
      background-color: #1C1C1C;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
    }
    .contact-info p {
      margin: 10px 0;
    }
    .contact-info .label {
      color: #FFD700;
      font-weight: bold;
    }

    form {
      background-color: #1C1C1C;
      padding: 20px;
      border-radius: 10px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #9B72FF;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 1em;
      background-color: #2A2A2A;
      color: #fff;
    }
    textarea {
      resize: vertical;
      min-height: 120px;
    }
    button {
      background-color: #00A8E8;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #007bb5;
    }
    nav {
  background-color: #003366;
  padding: 15px 0;
  text-align: center;
}

nav ul {

  padding: 0;

}

    .map-placeholder {

      align-items: center;

      margin-bottom: 30px;

</head>

  <!-- Header -->

    <div class="contact-info">
      <p><span class="label">📍 العنوان:</span> حي الإطارات، بلدية الجلفة</p>
      <p><span class="label">📞 الهاتف:</span> 07.78.57.51.01</p>
      <p><span class="label">✉ البريد الإلكتروني:</span> info@khdija-quran.edu.dz</p>
    </div>
<!-- خريطة (يمكن استبدالها بإطار Google Maps) -->

      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" name="email" placeholder="example@mail.com" required>

      <label for="message">رسالتك</label>
      <textarea id="message" name="message" placeholder="اكتب رسالتك هنا..." required></textarea>

      <button type="submit">إرسال الرسالة</button>
    </form>
